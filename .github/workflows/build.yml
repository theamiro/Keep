name: Build Validation
on:
    push:
        branches: ["develop"]
    pull_request:
        branches: ["main"]
jobs:
    build:
        runs-on: macos-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            - name: Perform Build Validation
              run: swift build -v
            - name: Run Tests
              run: swift test
